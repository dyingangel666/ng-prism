<div class="prism-perf-sparkline-wrap">
    <svg
        class="prism-perf-sparkline-svg"
        [attr.viewBox]="'0 0 600 ' + height()"
        preserveAspectRatio="none"
        xmlns="http://www.w3.org/2000/svg">
        <defs>
            <linearGradient
                id="perf-sparkg"
                x1="0"
                y1="0"
                x2="0"
                y2="1">
                <stop
                    offset="0%"
                    class="sparkline-gradient-start" />
                <stop
                    offset="100%"
                    class="sparkline-gradient-end" />
            </linearGradient>
            <filter id="perf-glow">
                <feGaussianBlur
                    stdDeviation="1.5"
                    result="coloredBlur" />
                <feMerge>
                    <feMergeNode in="coloredBlur" />
                    <feMergeNode in="SourceGraphic" />
                </feMerge>
            </filter>
        </defs>

        @if (warnY() !== null) {
            <line
                [attr.x1]="0"
                [attr.y1]="warnY()"
                [attr.x2]="600"
                [attr.y2]="warnY()"
                class="sparkline-warn-line" />
            <text
                [attr.x]="3"
                [attr.y]="warnY()! - 3"
                font-size="8"
                class="sparkline-warn-text"
                font-family="monospace">
                {{ thresholdWarn() }}ms
            </text>
        }

        <path
            [attr.d]="areaPath()"
            fill="url(#perf-sparkg)" />
        <path
            [attr.d]="linePath()"
            fill="none"
            class="sparkline-line"
            stroke-width="1.5"
            filter="url(#perf-glow)" />

        @if (peakPoint(); as peak) {
            <circle
                [attr.cx]="peak.x"
                [attr.cy]="peak.y"
                r="3"
                class="sparkline-peak"
                filter="url(#perf-glow)" />
        }

        @if (currentPoint(); as current) {
            <circle
                [attr.cx]="current.x"
                [attr.cy]="current.y"
                r="2.5"
                class="sparkline-current" />
            <circle
                [attr.cx]="current.x"
                [attr.cy]="current.y"
                r="5"
                class="sparkline-current-pulse"
                stroke-width="1">
                <animate
                    attributeName="r"
                    values="3;7"
                    dur="1.5s"
                    repeatCount="indefinite" />
                <animate
                    attributeName="opacity"
                    values="0.4;0"
                    dur="1.5s"
                    repeatCount="indefinite" />
            </circle>
        }
    </svg>
</div>
